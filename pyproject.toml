[project]
name = "ego2act"
version = "0.1.0"
description = "Ego2Act: generate, judge and reproduce goal-directed egocentric manipulation videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.12.0",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.0.0",
    "openai>=2.45.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67.0",
    "pillow>=12.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]
data = [
    "huggingface_hub>=1.0",
    "pyarrow>=15",
]

[project.scripts]
ego2act = "ego2act.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ego2act*", "baselines*"]

[tool.setuptools.data-files]
"share/ego2act" = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
